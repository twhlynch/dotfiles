$SCRIPTS = ~/.config/hypr/scripts

auth {
    fingerprint:enabled = true
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = inputFieldColors, 1, 3, smooth
    animation = fadeOut, 1, 4, smooth
}

background {
	monitor = 
    path = ~/dotfiles/config/wallpaper.png
}

input-field {
    monitor =
    size = 500, 60
    position = 0, -150
    halign = center
    valign = center

    inner_color = rgb(101011)
    outer_color = rgb(C3C3D6)
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.24

    font_family = Hack Nerd Font
    font_color = rgb(C3C3D6)

    placeholder_text = Enter Password
    check_color = rgb(C3DDD6)
    fail_color = rgb(D67A7A)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

label {
    text = cmd[update:1000] $SCRIPTS/hyprlock-label.sh
	position = 0, 150

    halign = center
    valign = center
    text_align = center

    font_size = 30
    font_family = Hack Nerd Font

    color = rgb(C3C3D6)
}
