$SCRIPTS = ~/.config/hypr/scripts

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    color = 0x00000000
    path = ~/dotfiles/config/wallpaper.png
    blur_passes = 5
}

input-field {
    monitor =
    size = 880, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = #101011
    outer_color = #C48283
    outline_thickness = 4
    dots_size = 0.24
    dots_spacing = 0.24

    font_family = Hack Nerd Font
    font_color = #C48283

    placeholder_text = Enter Password
    check_color = #C48283
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

label {
    text = cmd[update:1000] $SCRIPTS/hyprlock-label.sh

    halign = center
    valign = center
    text_align = center

    font_size = 30
    font_family = Hack Nerd Font

    color = #C3C3D6
}
