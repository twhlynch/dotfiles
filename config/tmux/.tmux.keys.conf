setw -g mode-keys vi
set -g mouse on

set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# ctrl s prefix
set -g prefix C-s

# resize
bind j resize-pane -D 5
bind k resize-pane -U 5
bind h resize-pane -L 5
bind l resize-pane -R 5

# / and \ for splitting (C- for current dir)
unbind %
unbind '"'
bind \\ split-window -h -c ~/
bind / split-window -v -c ~/
bind C-\\ split-window -h -c '#{pane_current_path}'
bind C-/ split-window -c '#{pane_current_path}'

# new window in current path or ~
bind c new-window -c ~/
bind C-c new-window -c '#{pane_current_path}'

# quit current
bind q kill-window

# auto rename current
bind C-, rename-window "#{b:pane_current_path}"

# draw pane
unbind-key -T root C-MouseDrag1Pane
unbind-key -T root C-MouseDrag1Empty
bind-key -T root C-M-MouseDrag1Pane new-pane -M
bind-key -T root C-M-MouseDrag1Empty new-pane -M

bind D new-window -c ~/dotfiles \; send-keys "nvim ." C-m \; rename-window "#{b:pane_current_path}" \;

# r to reload config
unbind r
bind r source-file ~/.tmux.conf
